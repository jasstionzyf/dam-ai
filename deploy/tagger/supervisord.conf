; dam-ai tagger container: two supervised processes.
; vLLM first (heavy load), proxy second; proxy is the service surface on 8091.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord-damai.pid

[program:vllm]
command=/bin/bash /app/deploy/tagger/start-vllm.sh
autorestart=unexpected
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tagger-proxy]
directory=/app
; proxy python: same conda env (fastapi/uvicorn/httpx included); explicit host/port
command=/data/apps/miniconda3/envs/vllm/bin/python -m tagger.api
autorestart=unexpected
startsecs=5
startretries=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=20
environment=DAMAI_PROXY_HOST="0.0.0.0",DAMAI_PROXY_PORT="8091",PYTHONPATH="/app",DAMAI_VLLM_URL="http://127.0.0.1:8101"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
