# dam-ai embedder — gpu0, port 8090. GPU0 shares vLLM (13.2G) + TEI (2x1.4G);
# qwen3-vl fp16 ~4.3G + siglip ~1.6G + clip ~1.7G + dinov2 ~0.35G fit in the remainder.
# Model source dir (gpu0/gpu7 same path) mounted read-only at /models.
services:
  dam-ai-embedder:
    build:
      context: ../..
      dockerfile: deploy/embedder/Dockerfile
    image: dam-ai/embedder:v0.2.0
    container_name: dam-ai-embedder
    depends_on: []
    volumes:
      - /data1/mlib_data/zhaoyufei_cache/soujpg/models:/models:ro
    ports:
      - "8090:8090"
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - DAMAI_REGISTRY=/app/dam-ai/registry/models.yaml
      # gpu0 shares the 3090 with vLLM(:30000)+TEI x2 — loading all 4 registry
      # models OOMs (T13 live). Only the model gcf embeddingProvider calls is
      # loaded here; qwen3-vl-embedding stays on gpu0:30001 (qwen3-vl-embedding
      # container) for damAiClient default-model callers.
      - DAMAI_LOAD_MODELS=clip-vit-l14
      # offline model loading: bare directory mount + offline env (see PLAN.md)
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 10s
