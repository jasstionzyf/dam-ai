# Built-in task template: translate
# Translate existing metadata text between languages; image optional.
name: translate
version: 1
model_default: qwen3.5-4b
allowed_models: [qwen3.5-4b]
images: {min: 1, max: 1}
description: "Translate stock metadata text into a target language."
task_params:
  - name: text
    type: string
    description: "The metadata text to translate."
    required: true
  - name: target_language
    type: string
    description: "Language code to translate into (e.g. en, zh, ja)."
    required: true
  - name: source_language
    type: string
    description: "Language code of the input text; auto-detect when omitted."
    required: false
    default: auto
prompt: |
  Translate the following stock-photo metadata text into language code
  "{{ task_params.target_language }}".
  Source language: "{{ task_params.source_language }}" (use "auto" to detect).
  Preserve meaning and tone; do not add commentary.

  Text:
  {{ task_params.text }}

  Return ONLY a JSON object matching the given schema.
schema:
  type: object
  properties:
    translated:
      type: string
      minLength: 1
    detected_source:
      type: string
      minLength: 2
  required: [translated, detected_source]
  additionalProperties: false
params: {temperature: 0.0, max_tokens: 1024}
