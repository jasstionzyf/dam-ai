# Built-in task template: nsfw_check
# Safety screening: binary verdict plus confidence and reason codes.
name: nsfw_check
version: 1
model_default: qwen3.5-4b
allowed_models: [qwen3.5-4b]
images: {min: 1, max: 1}
description: "Screen an image for NSFW content; returns a binary verdict with confidence."
task_params:
  - name: strictness
    type: string
    description: "How conservative the screening is: lenient | normal | strict."
    required: false
    default: normal
prompt: |
  You are a content safety reviewer. Inspect the image for NSFW content
  (nudity, sexual acts, explicit material) using "{{ task_params.strictness }}"
  strictness: lenient flags only explicit content, normal also flags suggestive
  content, strict also flags borderline content.

  Return ONLY a JSON object matching the given schema.
schema:
  type: object
  properties:
    is_nsfw: {type: boolean}
    confidence:
      type: number
      minimum: 0
      maximum: 1
    reason:
      type: string
      enum: [explicit, suggestive, borderline, clean]
  required: [is_nsfw, confidence, reason]
  additionalProperties: false
params: {temperature: 0.0, max_tokens: 256}
